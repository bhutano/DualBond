name: "CLA Assistant"

# Asks every contributor to accept the CLA (CLA.md) by commenting on their pull request,
# records the signature in signatures/cla.json on the `cla-signatures` branch,
# and sets a status check that can be made required in the branch protection rules.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/bhutano/DualBond/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: bhutano,bot*
          custom-notsigned-prcomment: 'Thank you for your contribution! Before we can merge it, please read the [DualBond CLA](https://github.com/bhutano/DualBond/blob/main/CLA.md) and sign it by posting the comment below.'
